<form action="/theme" method="post" enctype="multipart/form-data">
  <input type="hidden" name="theme" value="{% if theme == "ledger" %}ledger-light{% else %}ledger{% endif %}">
  <button class="btn btn-ghost btn-sm btn-circle" type="submit" aria-label="Switch to {% if theme == "ledger" %}light{% else %}dark{% endif %} mode" title="Switch to {% if theme == "ledger" %}light{% else %}dark{% endif %} mode">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      {% if theme == "ledger" %}
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
      {% else %}
      <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.464.402.807a6.25 6.25 0 0 0 8.268 8.268c.344-.215.83-.004.803.397"/>
      {% endif %}
    </svg>
  </button>
</form>
