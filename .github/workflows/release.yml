name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

# NOTE: amd64 only. Add an ubuntu-24.04-arm job and `docker buildx imagetools create` when someone needs arm64.
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, tag, push
        run: |
          v=${GITHUB_REF_NAME#v}
          docker build --pull -t "ghcr.io/vihu/pagebin:$v" .
          for t in "${v%.*}" "${v%%.*}" latest; do docker tag "ghcr.io/vihu/pagebin:$v" "ghcr.io/vihu/pagebin:$t"; done
          docker push --all-tags ghcr.io/vihu/pagebin
