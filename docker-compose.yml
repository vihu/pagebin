services:
  pagebin:
    # image: ghcr.io/vihu/pagebin:0
    build: .   # contributors: uncomment, then `docker compose up -d --build`
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${PAGEBIN_PORT:-5050}:${PAGEBIN_PORT:-5050}"
    volumes:
      - pagebin-data:/data

volumes:
  pagebin-data:
